<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The DingDong Foundation</title>
  <meta name="description" content="The DingDong Foundation — grants for church bell towers, pipe organs, stained glass, and sacred arts. Website coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #f7f1e6;
      --color-ink: #2b2118;
      --color-muted: #5a4a3b;
      --color-accent: #8a5a19;
      --color-rule: #d9c9ad;
      --font-display: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
      --font-body: "Georgia", "Times New Roman", serif;
      --space-2: 0.5rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      --space-6: 3rem;
      --space-7: 4rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #1d1712;
        --color-ink: #f3ebdd;
        --color-muted: #cdbfa9;
        --color-accent: #e0b35c;
        --color-rule: #4a3d2e;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 112.5%; } /* 18px base — well above the 12pt minimum */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-5) var(--space-3);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      line-height: 1.6;
      text-align: center;
    }
    main {
      max-width: 34rem;
      display: grid;
      gap: var(--space-4);
      justify-items: center;
    }
    .bell {
      width: 4rem;
      height: 4rem;
      color: var(--color-accent);
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2.25rem, 6vw, 3.5rem);
      line-height: 1.1;
      letter-spacing: 0.01em;
      margin: 0;
    }
    .rule {
      width: 4rem;
      height: 2px;
      background: var(--color-accent);
      border: 0;
      margin: 0;
    }
    p { margin: 0; }
    .lede {
      font-size: 1.15rem;
      color: var(--color-ink);
    }
    .mission {
      color: var(--color-muted);
      max-width: 30rem;
    }
    footer {
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-rule);
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.1rem;
      color: var(--color-muted);
    }
    @media (min-width: 768px) {
      body { padding: var(--space-7) var(--space-5); }
      main { gap: var(--space-5); }
    }
  </style>
</head>
<body>
  <main>
    <svg class="bell" viewBox="0 0 64 64" role="img" aria-label="Bell" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 6c1.7 0 3 1.3 3 3v2.2c8.4 1.4 14 8.4 14 17.3V38c0 3 1.5 5.8 4 7.5V48H11v-2.5c2.5-1.7 4-4.5 4-7.5v-9.5c0-8.9 5.6-15.9 14-17.3V9c0-1.7 1.3-3 3-3Z"/>
      <path d="M26 52a6 6 0 0 0 12 0"/>
    </svg>
    <h1>The DingDong Foundation</h1>
    <hr class="rule" aria-hidden="true">
    <p class="lede">A new website is on its way.</p>
    <p class="mission">Supporting the building and restoration of church bell towers, pipe organs, stained glass, and sacred arts.</p>
    <footer>Ave Maria</footer>
  </main>
</body>
</html>
